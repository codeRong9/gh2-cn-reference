name: 站点问题
description: 页面报错、排版错乱、链接失效、加载不出来
title: "[问题] "
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: 出问题的页面
      placeholder: 例如 https://coderong9.github.io/gh2-cn-reference/c/curve.offset-curve
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 具体现象，越具体越好
      placeholder: |
        打开页面后：……
        我期望：……
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: 浏览器 / 系统
      placeholder: Chrome 131 / Windows 11；或 Safari / iPhone 15
    validations:
      required: false
  - type: textarea
    id: screenshot
    attributes:
      label: 截图或控制台报错
      description: 可直接把图片拖进输入框；控制台报错请贴文本
    validations:
      required: false
